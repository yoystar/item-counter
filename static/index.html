<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>物品计数标注工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <style>
    :root {
      --bg: #041C1C;
      --canvas-bg: #020e0e;
      --accent: #f8e0c7;
      --accent-dim: rgba(248,224,199,0.12);
      --accent-border: rgba(248,224,199,0.35);
      --border: rgba(255,255,255,0.1);
      --text: #ddeee8;
      --text-dim: rgba(221,238,232,0.45);
      --success: #4ade80;
      --danger: #fb2c36;
      --font: 'Courier Prime', 'Courier New', monospace;
      --dot: rgba(64,200,180,0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex; height: 100vh;
      background-color: var(--bg); color: var(--text);
      font-family: var(--font); overflow: hidden;
    }

    #canvas-container {
      flex: 2; display: flex;
      align-items: center; justify-content: center;
      background: var(--canvas-bg); overflow: hidden; position: relative;
    }

    #panel {
      width: 288px; flex-shrink: 0;
      background-color: var(--bg);
      background-image: radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 0);
      background-size: 24px 24px;
      padding: 16px 14px;
      display: flex; flex-direction: column; gap: 10px;
      overflow-y: auto;
      border-left: 1px solid var(--border);
    }

    .panel-title {
      font-size: 11px; font-weight: 700;
      color: var(--accent);
      text-transform: uppercase; letter-spacing: 0.18em;
      padding-bottom: 2px;
    }

    .btn {
      width: 100%; padding: 8px 12px;
      border-radius: 2px; cursor: pointer;
      font-family: var(--font); font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.1em;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
      border: 1px solid;
    }
    .btn:disabled { opacity: 0.28; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent-dim); border-color: var(--accent-border); color: var(--accent);
    }
    .btn-primary:not(:disabled):hover { background: rgba(248,224,199,0.18); border-color: rgba(248,224,199,0.55); }

    .btn-success {
      background: rgba(74,222,128,0.07); border-color: rgba(74,222,128,0.3); color: var(--success);
    }
    .btn-success:not(:disabled):hover { background: rgba(74,222,128,0.15); }

    .btn-danger {
      background: rgba(251,44,54,0.07); border-color: rgba(251,44,54,0.3); color: var(--danger);
    }
    .btn-danger:not(:disabled):hover { background: rgba(251,44,54,0.15); }

    .btn-secondary {
      background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.14); color: rgba(255,255,255,0.65);
    }
    .btn-secondary:not(:disabled):hover { background: rgba(255,255,255,0.09); }

    .btn-warning {
      background: var(--accent-dim); border-color: var(--accent-border); color: var(--accent);
    }
    .btn-warning.active { background: rgba(248,224,199,0.18); border-color: var(--accent); }
    .btn-warning:not(:disabled):hover { background: rgba(248,224,199,0.18); }

    .toggle-row {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-dim);
    }
    .toggle { position: relative; width: 40px; height: 22px; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 22px; cursor: pointer; transition: all 0.2s;
    }
    .slider:before {
      content: ''; position: absolute;
      width: 14px; height: 14px; left: 3px; bottom: 3px;
      background: rgba(255,255,255,0.35); border-radius: 50%;
      transition: transform 0.2s;
    }
    input:checked + .slider { background: rgba(248,224,199,0.15); border-color: rgba(248,224,199,0.45); }
    input:checked + .slider:before { background: var(--accent); transform: translateX(18px); }
    input:disabled + .slider { opacity: 0.3; cursor: not-allowed; }

    .divider { border: none; border-top: 1px solid var(--border); }

    #validation-status {
      font-size: 10px; padding: 6px 8px;
      border: 1px solid rgba(74,222,128,0.22);
      background: rgba(74,222,128,0.05);
      color: var(--success);
      text-transform: uppercase; letter-spacing: 0.07em;
    }
    #validation-status.error {
      border-color: rgba(251,44,54,0.22);
      background: rgba(251,44,54,0.05);
      color: var(--danger);
    }

    #label-count-row { font-size: 10px; color: var(--text-dim); letter-spacing: 0.06em; }

    #label-list { display: flex; flex-direction: column; gap: 3px; }
    .label-item {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      padding: 5px 8px; font-size: 10px;
    }
    .label-badge {
      width: 18px; height: 18px;
      background: var(--accent); color: var(--bg);
      font-weight: 700; font-size: 9px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .label-coords { color: var(--text-dim); font-size: 10px; margin-left: 6px; flex: 1; }
    .label-delete {
      background: none; border: none; color: rgba(251,44,54,0.5);
      cursor: pointer; font-size: 14px; line-height: 1; padding: 1px 4px;
    }
    .label-delete:hover { color: var(--danger); }

    #drop-hint {
      color: rgba(255,255,255,0.35);
      font-size: 15px; text-align: center;
      pointer-events: auto; cursor: pointer;
      text-transform: uppercase; letter-spacing: 0.14em;
    }
    #drop-hint:hover { color: rgba(255,255,255,0.6); }

    details summary {
      cursor: pointer; user-select: none;
      font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--accent); margin-bottom: 8px;
      list-style: none;
    }
    details summary::-webkit-details-marker { display: none; }
    details summary::before { content: '▸ '; font-size: 9px; }
    details[open] summary::before { content: '▾ '; }

    input[type="range"] {
      -webkit-appearance: none; width: 100%; height: 2px;
      background: rgba(255,255,255,0.12); outline: none; margin: 6px 0;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 12px; height: 12px;
      background: var(--accent); cursor: pointer; border-radius: 0;
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(248,224,199,0.2); }

    /* ── 蓝白亮色主题 ────────────────────────────────────── */
    [data-theme="light"] {
      --bg: #dce8f2;
      --canvas-bg: #c4d8ea;
      --accent: #0053fd;
      --accent-dim: rgba(0,83,253,0.1);
      --accent-border: rgba(0,83,253,0.3);
      --border: rgba(0,83,253,0.14);
      --text: #0a1c28;
      --text-dim: rgba(10,28,40,0.5);
      --success: #166534;
      --danger: #991b1b;
      --dot: rgba(0,83,253,0.08);
    }
    [data-theme="light"] #canvas-container { background: var(--canvas-bg); }
    [data-theme="light"] #canvas-container::before {
      background: radial-gradient(ellipse at 2% 2%, rgba(180,210,255,0.65) 0%, transparent 60%);
      opacity: 0.5; mix-blend-mode: normal;
    }
    [data-theme="light"] .label-badge { color: var(--bg); }
    /* 亮色按钮 */
    [data-theme="light"] .btn-primary  { background: rgba(0,83,253,0.08); border-color: rgba(0,83,253,0.28); color: var(--accent); }
    [data-theme="light"] .btn-primary:not(:disabled):hover  { background: rgba(0,83,253,0.14); border-color: rgba(0,83,253,0.5); }
    [data-theme="light"] .btn-secondary { background: rgba(10,28,40,0.04); border-color: rgba(10,28,40,0.14); color: rgba(10,28,40,0.65); }
    [data-theme="light"] .btn-secondary:not(:disabled):hover { background: rgba(10,28,40,0.09); }
    [data-theme="light"] .btn-success  { background: rgba(22,101,52,0.07); border-color: rgba(22,101,52,0.28); color: var(--success); }
    [data-theme="light"] .btn-success:not(:disabled):hover  { background: rgba(22,101,52,0.14); }
    [data-theme="light"] .btn-danger   { background: rgba(153,27,27,0.07); border-color: rgba(153,27,27,0.28); color: var(--danger); }
    [data-theme="light"] .btn-danger:not(:disabled):hover   { background: rgba(153,27,27,0.14); }
    [data-theme="light"] .btn-warning  { background: rgba(0,83,253,0.08); border-color: rgba(0,83,253,0.28); color: var(--accent); }
    [data-theme="light"] .btn-warning.active { background: rgba(0,83,253,0.18); border-color: var(--accent); }
    [data-theme="light"] .btn-warning:not(:disabled):hover  { background: rgba(0,83,253,0.14); }
    /* 亮色切换开关 */
    [data-theme="light"] .slider { background: rgba(10,28,40,0.07); border-color: rgba(10,28,40,0.14); }
    [data-theme="light"] .slider:before { background: rgba(10,28,40,0.35); }
    [data-theme="light"] input:checked + .slider { background: rgba(0,83,253,0.18); border-color: rgba(0,83,253,0.5); }
    [data-theme="light"] input:checked + .slider:before { background: var(--accent); }
    /* 亮色其他元素 */
    [data-theme="light"] input[type="range"] { background: rgba(10,28,40,0.12); }
    [data-theme="light"] ::-webkit-scrollbar-thumb { background: rgba(0,83,253,0.2); }
    [data-theme="light"] .label-item { background: rgba(10,28,40,0.03); border-color: rgba(10,28,40,0.08); }
    [data-theme="light"] #drop-hint  { color: rgba(10,28,40,0.45); }
    [data-theme="light"] #drop-hint:hover { color: rgba(10,28,40,0.75); }
    [data-theme="light"] #validation-status       { border-color: rgba(22,101,52,0.22);  background: rgba(22,101,52,0.05);  color: var(--success); }
    [data-theme="light"] #validation-status.error { border-color: rgba(153,27,27,0.22); background: rgba(153,27,27,0.05); color: var(--danger); }
    [data-theme="light"] #btn-theme { color: var(--text-dim); border-color: var(--border); }

    /* ── 框选识别进度覆盖层 ──────────────────────────────────── */
    #match-overlay {
      position: absolute; inset: 0; z-index: 10;
      display: none; align-items: center; justify-content: center;
      background: rgba(2, 14, 14, 0.78);
      backdrop-filter: blur(3px);
    }
    #match-overlay.active { display: flex; }
    #match-log {
      width: min(400px, 88%);
      border: 1px solid var(--accent-border);
      background: rgba(2, 14, 14, 0.94);
      padding: 22px 26px;
      font-size: 12px; line-height: 1.9;
      box-shadow: 0 0 48px rgba(64,200,180,0.1);
    }
    .mlog-header {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.16em;
      color: var(--text-dim); margin-bottom: 10px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .mlog-line { display: flex; gap: 8px; min-height: 1.9em; }
    .mlog-prefix { color: var(--text-dim); flex-shrink: 0; user-select: none; }
    .mlog-text { color: var(--accent); }
    .mlog-cursor {
      display: inline-block; width: 7px; height: 0.82em;
      background: var(--accent); vertical-align: baseline;
      animation: mlog-blink 0.65s steps(1) infinite;
      margin-left: 1px; position: relative; top: 2px;
    }
    @keyframes mlog-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    [data-theme="light"] #match-overlay { background: rgba(196, 216, 234, 0.82); }
    [data-theme="light"] #match-log {
      background: rgba(220, 232, 242, 0.97);
      box-shadow: 0 0 48px rgba(0,83,253,0.07);
    }

    /* ── 背景光晕（左上角径向渐变）─────────────────────── */
    #canvas-container::before {
      content: '';
      position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(ellipse at 2% 2%, rgba(64,200,180,0.28) 0%, transparent 55%);
      opacity: 0.2; mix-blend-mode: lighten;
      transition: background 0.4s, opacity 0.4s;
    }

    /* ── 科技感点阵纹理 ──────────────────────────────────── */
    #canvas-container::after {
      content: '';
      position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background-image: radial-gradient(circle at 1px 1px, var(--dot) 1px, transparent 0);
      background-size: 24px 24px;
    }

    #canvas-container > canvas,
    #canvas-container > #drop-hint { position: relative; z-index: 1; }

    /* ── 主题切换按钮 ──────────────────────────────────── */
    #btn-theme {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 13px; cursor: pointer;
      padding: 2px 8px;
      font-family: var(--font);
      border-radius: 2px;
      transition: color 0.15s, border-color 0.15s;
      flex-shrink: 0;
    }
    #btn-theme:hover { color: var(--accent); border-color: var(--accent-border); }

    /* ── 全页颗粒纹理 ────────────────────────────────────── */
    #grain {
      position: fixed; inset: 0; width: 100%; height: 100%;
      z-index: 9999; pointer-events: none;
      opacity: 0.055; mix-blend-mode: overlay;
      transition: opacity 0.3s;
    }
    [data-theme="light"] #grain { opacity: 0.07; mix-blend-mode: multiply; }
  </style>
</head>
<body>

<div id="canvas-container">
  <div id="drop-hint" onclick="document.getElementById('file-input').click()">&gt; 上传图片后开始标注 <span class="mlog-cursor">▋</span></div>
  <canvas id="main-canvas"></canvas>
  <div id="match-overlay"><div id="match-log"></div></div>
</div>

<div id="panel">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <div class="panel-title">// 物品计数标注</div>
    <button id="btn-theme" title="切换主题">◑</button>
  </div>

  <button class="btn btn-primary" id="btn-upload" onclick="document.getElementById('file-input').click()">+ 上传图片</button>
  <input type="file" id="file-input" accept="image/*" style="display:none">

  <hr class="divider">

  <div style="display:flex;flex-direction:column;gap:8px;">
    <button class="btn btn-warning" id="btn-select" disabled>◎ 框选识别</button>

    <div id="select-confirm" style="display:none;padding:10px;border:1px solid var(--accent-border);background:var(--accent-dim);">
      <div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--accent);margin-bottom:8px;">拖拽框选目标后调整阈值</div>
      <div>
        <div style="display:flex;justify-content:space-between;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);"><label>相似度阈值</label><b style="color:var(--accent)" id="val-threshold">0.35</b></div>
        <input type="range" id="slider-threshold" min="0.3" max="0.95" step="0.05" value="0.35" style="width:100%">
        <div style="font-size:10px;color:var(--text-dim);margin-top:2px;">降低阈值匹配更多，误检增加</div>
      </div>
      <div style="display:flex;gap:6px;margin-top:8px;">
        <button class="btn btn-success" id="btn-match" disabled style="flex:1;padding:6px;">确认识别</button>
        <button class="btn btn-secondary" id="btn-cancel-select" style="flex:1;padding:6px;">取消</button>
      </div>
    </div>

    <div class="toggle-row">
      <span>手动模式</span>
      <label class="toggle">
        <input type="checkbox" id="toggle-manual" disabled checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <hr class="divider">

  <details>
    <summary>标注样式</summary>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <div>
        <div style="display:flex;justify-content:space-between;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);"><label>标注大小</label><b style="color:var(--accent)" id="val-label-size">50</b></div>
        <input type="range" id="slider-label-size" min="30" max="120" step="1" value="50" style="width:100%">
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);"><label>不透明度</label><b style="color:var(--accent)" id="val-opacity">60%</b></div>
        <input type="range" id="slider-opacity" min="10" max="100" step="5" value="60" style="width:100%">
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);">
        <label>标注颜色</label>
        <input type="color" id="picker-circle-color" value="#f34922" style="width:36px;height:24px;border:1px solid rgba(255,255,255,0.14);background:none;cursor:pointer;padding:2px;">
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-dim);">
        <label>数字颜色</label>
        <input type="color" id="picker-text-color" value="#f8f2ec" style="width:36px;height:24px;border:1px solid rgba(255,255,255,0.14);background:none;cursor:pointer;padding:2px;">
      </div>
    </div>
  </details>

  <hr class="divider">

  <button class="btn btn-primary" id="btn-sort" disabled>⇆ 标注重排序</button>

  <div style="display:flex;gap:6px;">
    <button class="btn btn-danger" id="btn-clear" disabled style="flex:1;">✕ 清除</button>
    <button class="btn btn-secondary" id="btn-export" disabled style="flex:1;">↓ 导出</button>
  </div>

  <hr class="divider">

  <div id="validation-status">— 尚未标注</div>
  <div id="label-count-row">共 <span id="label-count">0</span> 个标注</div>

  <hr class="divider">

  <div id="label-list"></div>
</div>

<script>
// ── 全局状态 ──────────────────────────────────────────────
const state = {
  labels: [],           // [{id, fabricGroup, x, y, number, circleColor, textColor}]
  nextId: 1,
  imageScale: 1,        // Canvas显示尺寸 / 原图尺寸
  imagePath: null,      // 服务端路径，用于 /detect 和 /export
  imageWidth: 0,        // 原图宽度（像素）
  imageHeight: 0,
  manualMode: true,
  selectMode: false,    // 框选识别模式
  drawing: false,       // 正在拖拽绘制中
  drawStart: null,      // {x, y} Canvas 坐标
  tmpRect: null,        // 临时选框 fabric.Rect
};

// ── Undo 栈 ───────────────────────────────────────────────
const undoStack = [];
const MAX_UNDO = 30;
let _suppressUndo = false;

// ── Fabric Canvas 初始化 ───────────────────────────────────
const canvas = new fabric.Canvas('main-canvas', {
  selection: false,
  defaultCursor: 'crosshair',
});

// ── 图片上传 ──────────────────────────────────────────────
document.getElementById('file-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append('file', file);

  const resp = await fetch('/upload', { method: 'POST', body: formData });
  if (!resp.ok) {
    alert('上传失败：' + (await resp.json()).error);
    return;
  }
  const data = await resp.json();
  loadImageToCanvas(data.image_url, data.image_path, data.width, data.height);
  e.target.value = '';
});

function loadImageToCanvas(imageUrl, imagePath, origW, origH) {
  canvas.clear();
  state.labels = [];
  state.nextId = 1;
  state.imagePath = imagePath;
  state.imageWidth = origW;
  state.imageHeight = origH;
  renderLabelList();
  updateValidation();

  const container = document.getElementById('canvas-container');
  const maxW = container.clientWidth - 16;
  const maxH = container.clientHeight - 16;
  const scale = Math.min(maxW / origW, maxH / origH, 1);
  state.imageScale = scale;

  const dispW = Math.round(origW * scale);
  const dispH = Math.round(origH * scale);
  canvas.setWidth(dispW);
  canvas.setHeight(dispH);

  document.getElementById('drop-hint').style.display = 'none';

  fabric.Image.fromURL(imageUrl, (img) => {
    img.set({ scaleX: scale, scaleY: scale, selectable: false, evented: false, left: 0, top: 0 });
    canvas.add(img);
    canvas.sendToBack(img);
    canvas.renderAll();

    document.getElementById('btn-select').disabled = false;
    document.getElementById('toggle-manual').disabled = false;
    document.getElementById('btn-sort').disabled = false;
    document.getElementById('btn-clear').disabled = false;
    document.getElementById('btn-export').disabled = false;
  });
}

// ── Undo：保存当前标注快照 ────────────────────────────────
function saveUndoState() {
  if (_suppressUndo) return;
  undoStack.push([...state.labels]);
  if (undoStack.length > MAX_UNDO) undoStack.shift();
}

// ── Undo：恢复上一个快照 ──────────────────────────────────
function undo() {
  if (undoStack.length === 0) return;
  const prev = undoStack.pop();
  state.labels.forEach(l => canvas.remove(l.fabricGroup));
  state.labels = prev;
  state.labels.forEach(l => {
    canvas.add(l.fabricGroup);
    canvas.bringToFront(l.fabricGroup);
  });
  state.nextId = state.labels.length > 0
    ? Math.max(...state.labels.map(l => l.id)) + 1
    : 1;
  renderLabelList();
  updateValidation();
  checkOverlaps();
  canvas.renderAll();
}

// ── 标注圆形半径（读取滑块值，单位：原图像素）────────────
function getLabelRadius() {
  return parseInt(document.getElementById('slider-label-size').value, 10);
}

// ── 标注填充不透明度（0~1）────────────────────────────────
function getLabelOpacity() {
  return parseInt(document.getElementById('slider-opacity').value, 10) / 100;
}

// ── hex 颜色转 rgba（供圆环半透明填充使用）──────────────
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ── 更新所有已有标注的大小与颜色 ─────────────────────────
function updateAllLabels() {
  const r = getLabelRadius() * state.imageScale;
  const sw = Math.max(2, Math.round(r * 0.09));
  const circleColor = document.getElementById('picker-circle-color').value;
  const textColor = document.getElementById('picker-text-color').value;
  state.labels.forEach(label => {
    label.circleColor = circleColor;
    label.textColor = textColor;
    const objs = label.fabricGroup.getObjects();
    const circle = objs.find(o => o.type === 'circle');
    const textObj = objs.find(o => o.type === 'text');
    if (circle) circle.set({
      radius: r,
      fill: hexToRgba(circleColor, getLabelOpacity()),
      stroke: circleColor,
      strokeWidth: sw,
      shadow: new fabric.Shadow({ color: circleColor, blur: Math.round(r * 0.5), offsetX: 0, offsetY: 0 }),
    });
    if (textObj) textObj.set({
      fontSize: Math.max(10, r * 0.9),
      fill: textColor,
      fontFamily: "'Courier Prime', 'Courier New', monospace",
    });
    label.fabricGroup.addWithUpdate();
  });
  checkOverlaps();
  canvas.renderAll();
}

// ── 重叠检测（重叠标注高亮为警告色）─────────────────────
function checkOverlaps() {
  const r = getLabelRadius();
  const thresh = (r * 2) * (r * 2);
  const overlapping = new Set();
  for (let i = 0; i < state.labels.length; i++) {
    for (let j = i + 1; j < state.labels.length; j++) {
      const dx = state.labels[i].x - state.labels[j].x;
      const dy = state.labels[i].y - state.labels[j].y;
      if (dx * dx + dy * dy < thresh) {
        overlapping.add(state.labels[i].id);
        overlapping.add(state.labels[j].id);
      }
    }
  }
  const dispR = r * state.imageScale;
  const normalSW = Math.max(2, Math.round(dispR * 0.09));
  const overlapSW = Math.max(3, Math.round(dispR * 0.15));
  const glurN = Math.round(dispR * 0.5);
  const glurO = Math.round(dispR * 0.65);
  state.labels.forEach(label => {
    const circle = label.fabricGroup.getObjects().find(o => o.type === 'circle');
    if (circle) {
      if (overlapping.has(label.id)) {
        circle.set({
          stroke: '#FFFF00', strokeWidth: overlapSW,
          fill: hexToRgba('#FFFF00', 0.15),
          shadow: new fabric.Shadow({ color: '#FFFF00', blur: glurO, offsetX: 0, offsetY: 0 }),
        });
      } else {
        const c = label.circleColor || document.getElementById('picker-circle-color').value;
        circle.set({
          stroke: c, strokeWidth: normalSW,
          fill: hexToRgba(c, getLabelOpacity()),
          shadow: new fabric.Shadow({ color: c, blur: glurN, offsetX: 0, offsetY: 0 }),
        });
      }
      label.fabricGroup.addWithUpdate();
    }
  });
}

// ── 在 Canvas 坐标处创建标注 ──────────────────────────────
function addLabel(canvasX, canvasY) {
  saveUndoState();
  const r = getLabelRadius() * state.imageScale;
  const number = state.labels.length + 1;

  const circleColor = document.getElementById('picker-circle-color').value;
  const textColor = document.getElementById('picker-text-color').value;
  const sw = Math.max(2, Math.round(r * 0.09));
  const circle = new fabric.Circle({
    radius: r,
    fill: hexToRgba(circleColor, getLabelOpacity()),
    stroke: circleColor,
    strokeWidth: sw,
    shadow: new fabric.Shadow({ color: circleColor, blur: Math.round(r * 0.5), offsetX: 0, offsetY: 0 }),
    originX: 'center', originY: 'center',
  });
  const text = new fabric.Text(String(number), {
    fontSize: Math.max(10, r * 0.9),
    fill: textColor,
    fontWeight: 'bold',
    fontFamily: "'Courier Prime', 'Courier New', monospace",
    originX: 'center', originY: 'center',
  });
  const group = new fabric.Group([circle, text], {
    left: canvasX, top: canvasY,
    originX: 'center', originY: 'center',
    selectable: true, evented: true,
    hasControls: false, hasBorders: false,
    lockScalingX: true, lockScalingY: true, lockRotation: true,
    hoverCursor: 'grab',
  });

  canvas.add(group);
  canvas.bringToFront(group);

  state.labels.push({
    id: state.nextId++,
    fabricGroup: group,
    x: Math.round(canvasX / state.imageScale),
    y: Math.round(canvasY / state.imageScale),
    number,
    circleColor,
    textColor,
  });

  renderLabelList();
  updateValidation();
  checkOverlaps();
  canvas.renderAll();
}

// ── 删除指定 id 的标注 ────────────────────────────────────
function removeLabel(id) {
  const idx = state.labels.findIndex(l => l.id === id);
  if (idx === -1) return;
  saveUndoState();
  canvas.remove(state.labels[idx].fabricGroup);
  state.labels.splice(idx, 1);
  renumberLabels();
  renderLabelList();
  updateValidation();
  checkOverlaps();
  canvas.renderAll();
}

// ── 重新排序（行扫描：从上到下逐行，行内从左到右）────────
document.getElementById('btn-sort').addEventListener('click', () => {
  if (state.labels.length === 0) return;
  saveUndoState();

  // 行高阈值 = 1.5 倍标注半径，容纳同行内的微小 y 错位
  const rowThreshold = getLabelRadius() * 1.5;

  // 先按 y 排序，再按相邻 y 差分行
  const byY = [...state.labels].sort((a, b) => a.y - b.y);
  const rows = [];
  let cur = [byY[0]];
  for (let i = 1; i < byY.length; i++) {
    if (byY[i].y - byY[i - 1].y <= rowThreshold) {
      cur.push(byY[i]);
    } else {
      rows.push(cur);
      cur = [byY[i]];
    }
  }
  rows.push(cur);

  // 行内按 x 从左到右排序，展平
  state.labels = rows.flatMap(row => row.sort((a, b) => a.x - b.x));

  renumberLabels();
  renderLabelList();
  updateValidation();
  checkOverlaps();
  canvas.renderAll();
});

// ── 清除全部标注 ──────────────────────────────────────────
document.getElementById('btn-clear').addEventListener('click', () => {
  saveUndoState();
  state.labels.forEach(l => canvas.remove(l.fabricGroup));
  state.labels = [];
  state.nextId = 1;
  renderLabelList();
  updateValidation();
  canvas.renderAll();
});

// ── 重新编号（删除后保证 1..N 连续）──────────────────────
function renumberLabels() {
  state.labels.forEach((label, i) => {
    label.number = i + 1;
    const objs = label.fabricGroup.getObjects();
    const textObj = objs.find(o => o.type === 'text');
    if (textObj) {
      textObj.set('text', String(i + 1));
      label.fabricGroup.addWithUpdate();
    }
  });
}

// ── 渲染右侧标注列表 ──────────────────────────────────────
function renderLabelList() {
  const list = document.getElementById('label-list');
  list.innerHTML = '';
  state.labels.forEach(label => {
    const item = document.createElement('div');
    item.className = 'label-item';
    item.innerHTML = `
      <div class="label-badge">${label.number}</div>
      <span class="label-coords">(${label.x}, ${label.y})</span>
      <button class="label-delete" onclick="removeLabel(${label.id})">×</button>
    `;
    list.appendChild(item);
  });
}

// ── 校验编号连续性 ────────────────────────────────────────
function updateValidation() {
  const el = document.getElementById('validation-status');
  const countEl = document.getElementById('label-count');
  const n = state.labels.length;
  countEl.textContent = n;

  if (n === 0) {
    el.textContent = '— 尚未标注';
    el.className = '';
    return;
  }

  const nums = state.labels.map(l => l.number).sort((a, b) => a - b);
  const ok = nums.every((v, i) => v === i + 1);
  if (ok) {
    el.textContent = `✓ 编号正常，共 ${n} 个物品`;
    el.className = '';
  } else {
    el.textContent = `✕ 编号异常，请检查`;
    el.className = 'error';
  }
}

// ── 手动点击 ─────────────────────────────────────────────
document.getElementById('toggle-manual').addEventListener('change', (e) => {
  state.manualMode = e.target.checked;
  canvas.defaultCursor = state.manualMode ? 'crosshair' : 'default';
});

// ── 标注大小与颜色控件 ────────────────────────────────────
document.getElementById('slider-label-size').addEventListener('input', (e) => {
  document.getElementById('val-label-size').textContent = e.target.value;
  updateAllLabels();
});
document.getElementById('picker-circle-color').addEventListener('input', updateAllLabels);
document.getElementById('picker-text-color').addEventListener('input', updateAllLabels);
document.getElementById('slider-opacity').addEventListener('input', (e) => {
  document.getElementById('val-opacity').textContent = e.target.value + '%';
  updateAllLabels();
});

// ── 点击 vs 拖拽区分 ─────────────────────────────────────
let _didDrag = false;
let _mouseDownTarget = null;

function setLabelsSelectable(on) {
  state.labels.forEach(l => l.fabricGroup.set({ selectable: on }));
  canvas.renderAll();
}

canvas.on('object:moving', () => { _didDrag = true; });

canvas.on('object:modified', (opt) => {
  const obj = opt.target;
  if (!obj || obj.type !== 'group') return;
  const label = state.labels.find(l => l.fabricGroup === obj);
  if (!label) return;
  label.x = Math.round(obj.left / state.imageScale);
  label.y = Math.round(obj.top / state.imageScale);
  canvas.discardActiveObject();
  renderLabelList();
  checkOverlaps();
  canvas.renderAll();
});

canvas.on('mouse:down', (opt) => {
  _didDrag = false;
  _mouseDownTarget = (opt.target && opt.target.type === 'group') ? opt.target : null;

  const pointer = canvas.getPointer(opt.e);
  const x = pointer.x;
  const y = pointer.y;
  const imgW = state.imageWidth * state.imageScale;
  const imgH = state.imageHeight * state.imageScale;

  if (state.selectMode) {
    if (x < 0 || y < 0 || x > imgW || y > imgH) return;
    if (state.tmpRect) { canvas.remove(state.tmpRect); state.tmpRect = null; }
    state.drawing = true;
    state.drawStart = { x, y };
    state.tmpRect = new fabric.Rect({
      left: x, top: y, width: 0, height: 0,
      stroke: '#f39c12', strokeWidth: 2,
      strokeDashArray: [6, 4],
      fill: 'rgba(243,156,18,0.12)',
      selectable: false, evented: false,
    });
    canvas.add(state.tmpRect);
    document.getElementById('btn-match').disabled = true;
    return;
  }

  // 手动模式：空白处点击新增标注
  if (!state.manualMode || !state.imagePath) return;
  if (x < 0 || y < 0 || x > imgW || y > imgH) return;
  if (_mouseDownTarget) return;   // 点在已有标注上，不叠加新标注
  addLabel(x, y);
});

canvas.on('mouse:move', (opt) => {
  if (!state.drawing || !state.selectMode) return;
  const p = canvas.getPointer(opt.e);
  const rx = Math.min(p.x, state.drawStart.x);
  const ry = Math.min(p.y, state.drawStart.y);
  const rw = Math.abs(p.x - state.drawStart.x);
  const rh = Math.abs(p.y - state.drawStart.y);
  state.tmpRect.set({ left: rx, top: ry, width: rw, height: rh });
  canvas.renderAll();
});

canvas.on('mouse:up', (opt) => {
  // 框选模式：完成矩形
  if (state.drawing && state.selectMode) {
    state.drawing = false;
    const rw = state.tmpRect.width;
    const rh = state.tmpRect.height;
    if (rw < 10 || rh < 10) {
      canvas.remove(state.tmpRect);
      state.tmpRect = null;
    } else {
      document.getElementById('btn-match').disabled = false;
    }
    canvas.renderAll();
    _mouseDownTarget = null;
    return;
  }

  // 点击标注删除（未拖拽 + 按下和抬起是同一个标注）
  if (!state.selectMode && !_didDrag && _mouseDownTarget && opt.target === _mouseDownTarget) {
    const label = state.labels.find(l => l.fabricGroup === _mouseDownTarget);
    if (label) removeLabel(label.id);
  }
  _mouseDownTarget = null;
});

// ── 操作进度动画（通用）─────────────────────────────────
const MATCH_STEPS = [
  '初始化模板识别引擎',
  '预处理 CLAHE 对比度均衡',
  '多尺度图像缩放 [×0.85 / ×1.0 / ×1.15]',
  '多角度旋转匹配 [8 方向 × 45°]',
  '非极大值抑制 (NMS)',
  '聚合候选结果',
];
const EXPORT_STEPS = [
  '渲染画布标注层',
  '合成底图与标注',
  '编码 PNG 图像数据',
  '准备文件下载',
];
let _progressAnimTimer = null;
let _progressEl = null;
let _progressVal = 0;
let _matchAbortCtrl = null;
let _exportAbortCtrl = null;

// withProgressOnLast: 最后一步是否附加百分比动画（match 用，export 不用）
function startProgressAnim(steps, header, withProgressOnLast, onComplete) {
  const overlay = document.getElementById('match-overlay');
  const log = document.getElementById('match-log');
  log.innerHTML = `<div class="mlog-header">${header}</div>`;
  overlay.classList.add('active');
  _progressEl = null;
  _progressVal = 0;

  let stepIdx = 0, charIdx = 0, cursorEl = null;

  function removeCursor() {
    if (cursorEl && cursorEl.parentNode) cursorEl.parentNode.removeChild(cursorEl);
    cursorEl = null;
  }

  function appendLine(stepText, withProgress) {
    const line = document.createElement('div');
    line.className = 'mlog-line';
    const prefix = document.createElement('span');
    prefix.className = 'mlog-prefix';
    prefix.textContent = '//';
    const content = document.createElement('span');
    content.className = 'mlog-text';
    cursorEl = document.createElement('span');
    cursorEl.className = 'mlog-cursor';
    line.appendChild(prefix);
    line.appendChild(content);
    if (withProgress) {
      const pct = document.createElement('span');
      pct.style.cssText = 'color:var(--text-dim);margin-left:6px;min-width:3em;';
      pct.textContent = '0%';
      _progressEl = pct;
      line.appendChild(pct);
    }
    line.appendChild(cursorEl);
    log.appendChild(line);
    charIdx = 0;

    _progressAnimTimer = setInterval(() => {
      if (charIdx < stepText.length) {
        content.textContent += stepText[charIdx++];
      } else {
        clearInterval(_progressAnimTimer);
        if (withProgress) {
          _progressAnimTimer = setInterval(() => {
            if (_progressVal < 99) {
              _progressVal++;
              if (_progressEl) _progressEl.textContent = _progressVal + '%';
            }
          }, 35);
        } else {
          stepIdx++;
          _progressAnimTimer = setTimeout(nextStep, 110);
        }
      }
    }, 26);
  }

  function nextStep() {
    removeCursor();
    if (stepIdx < steps.length) {
      const isLast = stepIdx === steps.length - 1;
      appendLine(steps[stepIdx], !!withProgressOnLast && isLast);
    } else if (typeof onComplete === 'function') {
      onComplete();
    }
  }

  nextStep();
}

function stopProgressAnim(resultText, isSuccess) {
  clearInterval(_progressAnimTimer);
  clearTimeout(_progressAnimTimer);
  _progressAnimTimer = null;
  const overlay = document.getElementById('match-overlay');
  const log = document.getElementById('match-log');
  const cursor = log.querySelector('.mlog-cursor');
  if (cursor) cursor.remove();
  if (_progressEl) { _progressEl.textContent = '100%'; _progressEl = null; }
  const line = document.createElement('div');
  line.className = 'mlog-line';
  line.style.cssText = `margin-top:10px;padding-top:8px;border-top:1px solid var(--border);font-weight:700;color:${isSuccess ? 'var(--success)' : 'var(--danger)'};`;
  const prefix = document.createElement('span');
  prefix.textContent = isSuccess ? '✓' : '✕';
  const text = document.createElement('span');
  text.textContent = resultText;
  line.appendChild(prefix);
  line.appendChild(text);
  log.appendChild(line);
  setTimeout(() => {
    overlay.classList.remove('active');
    log.innerHTML = '';
  }, 2000);
}

// ── 框选识别模式 ──────────────────────────────────────────
function cancelSelectMode() {
  state.selectMode = false;
  state.drawing = false;
  state.drawStart = null;
  if (state.tmpRect) { canvas.remove(state.tmpRect); state.tmpRect = null; }
  canvas.defaultCursor = 'default';
  setLabelsSelectable(true);
  canvas.renderAll();
  document.getElementById('btn-select').textContent = '◎ 框选识别';
  document.getElementById('btn-select').classList.remove('active');
  document.getElementById('select-confirm').style.display = 'none';
  document.getElementById('btn-match').disabled = true;
}

document.getElementById('btn-select').addEventListener('click', () => {
  if (state.selectMode) {
    cancelSelectMode();
    return;
  }
  // 互斥：关闭手动模式
  if (state.manualMode) {
    document.getElementById('toggle-manual').checked = false;
    state.manualMode = false;
    canvas.defaultCursor = 'default';
  }
  state.selectMode = true;
  canvas.defaultCursor = 'crosshair';
  setLabelsSelectable(false);   // 框选期间禁止误拖标注
  document.getElementById('btn-select').textContent = '◎ 框选中（点击取消）';
  document.getElementById('btn-select').classList.add('active');
  document.getElementById('select-confirm').style.display = 'block';
});

document.getElementById('slider-threshold').addEventListener('input', (e) => {
  document.getElementById('val-threshold').textContent = parseFloat(e.target.value).toFixed(2);
});

document.getElementById('btn-cancel-select').addEventListener('click', cancelSelectMode);

document.getElementById('btn-match').addEventListener('click', async () => {
  if (!state.tmpRect || !state.imagePath) return;

  const scale = state.imageScale;
  const templateBox = {
    x: Math.round(state.tmpRect.left / scale),
    y: Math.round(state.tmpRect.top / scale),
    w: Math.round(state.tmpRect.width / scale),
    h: Math.round(state.tmpRect.height / scale),
  };
  const threshold = parseFloat(document.getElementById('slider-threshold').value);

  const btn = document.getElementById('btn-match');
  btn.disabled = true;
  btn.textContent = '识别中...';
  _matchAbortCtrl = new AbortController();
  startProgressAnim(MATCH_STEPS, '// template matching', true);

  try {
    const resp = await fetch('/match', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image_path: state.imagePath, template_box: templateBox, threshold }),
      signal: _matchAbortCtrl.signal,
    });
    const data = await resp.json();

    cancelSelectMode();

    if (!resp.ok) {
      stopProgressAnim('识别请求失败：' + data.error, false);
      return;
    }

    saveUndoState();
    state.labels.forEach(l => canvas.remove(l.fabricGroup));
    state.labels = [];
    state.nextId = 1;

    if (data.items.length === 0) {
      stopProgressAnim('未找到匹配物品，请降低阈值或重新框选', false);
    } else {
      stopProgressAnim(`识别完成 → 共 ${data.items.length} 个物品`, true);
      _suppressUndo = true;
      data.items.forEach(item => {
        const cx = (item.x + item.w / 2) * state.imageScale;
        const cy = (item.y + item.h / 2) * state.imageScale;
        addLabel(cx, cy);
      });
      _suppressUndo = false;
      // 按从上到下、从左到右重新排序编号
      state.labels.sort((a, b) => a.y !== b.y ? a.y - b.y : a.x - b.x);
      renumberLabels();
      renderLabelList();
      updateValidation();
      checkOverlaps();
      canvas.renderAll();
    }
  } catch (err) {
    if (err.name !== 'AbortError') stopProgressAnim('识别请求失败', false);
  } finally {
    _matchAbortCtrl = null;
    btn.textContent = '✅ 确认识别';
  }
});

// ── 导出图片 ──────────────────────────────────────────────
document.getElementById('btn-export').addEventListener('click', () => {
  if (state.labels.length === 0) {
    alert('请先添加标注再导出');
    return;
  }

  const btn = document.getElementById('btn-export');
  btn.disabled = true;
  btn.textContent = '导出中...';
  _exportAbortCtrl = new AbortController();

  // 先同步拿到画布数据，再播放动画（toDataURL 是同步操作）
  canvas.renderAll();
  const dataURL = canvas.toDataURL({ format: 'png', quality: 1 });

  startProgressAnim(EXPORT_STEPS, '// export image', false, () => {
    // 所有步骤动画播完后才触发
    stopProgressAnim('导出完成 → annotated.png', true);
    _exportAbortCtrl = null;
    btn.disabled = false;
    btn.textContent = '↓ 导出';
    const a = document.createElement('a');
    a.href = dataURL;
    a.download = 'annotated.png';
    a.click();
  });
});

// ── Ctrl+Z 撤销 / Esc 关闭进度框 ────────────────────────
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
    e.preventDefault();
    undo();
  }
  if (e.key === 'Escape') {
    const overlay = document.getElementById('match-overlay');
    if (overlay.classList.contains('active')) {
      e.preventDefault();
      if (_matchAbortCtrl) { _matchAbortCtrl.abort(); _matchAbortCtrl = null; }
      if (_exportAbortCtrl) {
        _exportAbortCtrl = null;
        const exportBtn = document.getElementById('btn-export');
        exportBtn.disabled = false;
        exportBtn.textContent = '↓ 导出';
      }
      clearInterval(_progressAnimTimer);
      clearTimeout(_progressAnimTimer);
      _progressAnimTimer = null;
      _progressEl = null;
      overlay.classList.remove('active');
      document.getElementById('match-log').innerHTML = '';
      cancelSelectMode();
    }
  }
});

// ── 主题切换 ──────────────────────────────────────────────
(function () {
  const root = document.documentElement;
  const btn = document.getElementById('btn-theme');

  const applyThemeColors = () => {
    document.getElementById('picker-circle-color').value = '#f34922';
    document.getElementById('picker-text-color').value = '#f8f2ec';
    if (state.labels.length > 0) updateAllLabels();
  };

  const apply = (theme) => {
    if (theme === 'light') {
      root.setAttribute('data-theme', 'light');
      btn.textContent = '◑';
      btn.title = '切换至深色模式';
    } else {
      root.removeAttribute('data-theme');
      btn.textContent = '◐';
      btn.title = '切换至蓝白模式';
    }
    applyThemeColors();
  };

  apply(localStorage.getItem('theme') || 'dark');
  btn.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    localStorage.setItem('theme', next);
    apply(next);
  });
})();
