<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>物品计数标注工具</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; background: #1a1a2e; color: #e0e0e0; font-family: system-ui, sans-serif; overflow: hidden; }

    #canvas-container {
      flex: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f1a;
      overflow: hidden;
      position: relative;
    }

    #panel {
      width: 280px;
      flex-shrink: 0;
      background: #16213e;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      border-left: 1px solid #2a2a4a;
    }

    .panel-title { font-size: 18px; font-weight: bold; color: #a0c4ff; }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: #4a90d9; color: white; }
    .btn-success { background: #27ae60; color: white; }
    .btn-danger  { background: #e74c3c; color: white; }
    .btn-secondary { background: #34495e; color: white; }
    .btn-warning { background: #e67e22; color: white; }
    .btn-warning.active { background: #f39c12; outline: 2px solid #f39c12; }
    .btn:not(:disabled):hover { opacity: 0.85; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
    }
    .toggle {
      position: relative; width: 44px; height: 24px;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #555; border-radius: 24px; cursor: pointer;
      transition: background 0.2s;
    }
    .slider:before {
      content: ''; position: absolute;
      width: 18px; height: 18px; left: 3px; bottom: 3px;
      background: white; border-radius: 50%;
      transition: transform 0.2s;
    }
    input:checked + .slider { background: #e74c3c; }
    input:checked + .slider:before { transform: translateX(20px); }

    .divider { border: none; border-top: 1px solid #2a2a4a; }

    #validation-status {
      font-size: 13px;
      padding: 8px 10px;
      border-radius: 6px;
      background: #0f2a1a;
      color: #2ecc71;
    }
    #validation-status.error { background: #2a0f0f; color: #e74c3c; }

    #label-count-row { font-size: 13px; color: #aaa; }

    #label-list { display: flex; flex-direction: column; gap: 6px; }
    .label-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f1a2e;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 13px;
    }
    .label-badge {
      width: 22px; height: 22px;
      background: #e74c3c;
      border-radius: 50%;
      color: white;
      font-weight: bold;
      font-size: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .label-coords { color: #888; font-size: 12px; margin-left: 8px; flex: 1; }
    .label-delete {
      background: none; border: none; color: #e74c3c;
      cursor: pointer; font-size: 16px; line-height: 1; padding: 2px 4px;
    }
    .label-delete:hover { color: #ff6b6b; }

    #drop-hint {
      color: #444;
      font-size: 15px;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="canvas-container">
  <div id="drop-hint">上传图片后开始标注</div>
  <canvas id="main-canvas"></canvas>
</div>

<div id="panel">
  <div class="panel-title">物品计数标注</div>

  <button class="btn btn-primary" id="btn-upload" onclick="document.getElementById('file-input').click()">📂 上传图片</button>
  <input type="file" id="file-input" accept="image/*" style="display:none">

  <button class="btn btn-success" id="btn-detect" disabled>🔍 自动识别</button>

  <details id="detect-params" style="font-size:13px;color:#ccc;">
    <summary style="cursor:pointer;user-select:none;color:#a0c4ff;margin-bottom:6px;">⚙️ 识别参数</summary>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <div>
        <div style="display:flex;justify-content:space-between;"><label>区块大小</label><b id="val-block-size">51</b></div>
        <input type="range" id="slider-block-size" min="11" max="201" step="2" value="51" style="width:100%">
        <div style="font-size:11px;color:#777;">值越大对背景纹理越不敏感</div>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;"><label>阈值偏移 C</label><b id="val-c-value">10</b></div>
        <input type="range" id="slider-c-value" min="1" max="30" step="1" value="10" style="width:100%">
        <div style="font-size:11px;color:#777;">值越大消除的弱边缘越多</div>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;"><label>形态学降噪</label><b id="val-morph">1</b></div>
        <input type="range" id="slider-morph" min="0" max="5" step="1" value="1" style="width:100%">
        <div style="font-size:11px;color:#777;">开运算去除小噪点（0=关闭）</div>
      </div>
    </div>
  </details>

  <button class="btn btn-warning" id="btn-select" disabled>🎯 框选识别</button>

  <div id="select-confirm" style="display:none;font-size:13px;color:#ccc;padding:8px;background:#1a1a0a;border-radius:6px;border:1px solid #f39c12;">
    <div style="color:#f39c12;font-weight:bold;margin-bottom:6px;">拖拽框选目标后调整阈值</div>
    <div>
      <div style="display:flex;justify-content:space-between;"><label>相似度阈值</label><b id="val-threshold">0.70</b></div>
      <input type="range" id="slider-threshold" min="0.3" max="0.95" step="0.05" value="0.70" style="width:100%">
      <div style="font-size:11px;color:#777;">降低阈值可找到更多匹配，但误检会增加</div>
    </div>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button class="btn btn-success" id="btn-match" disabled style="flex:1;padding:6px;">✅ 确认识别</button>
      <button class="btn btn-secondary" id="btn-cancel-select" style="flex:1;padding:6px;">❌ 取消</button>
    </div>
  </div>

  <div class="toggle-row">
    <span>✏️ 手动模式</span>
    <label class="toggle">
      <input type="checkbox" id="toggle-manual" disabled>
      <span class="slider"></span>
    </label>
  </div>

  <button class="btn btn-danger" id="btn-clear" disabled>🗑 清除全部标注</button>
  <button class="btn btn-secondary" id="btn-export" disabled>💾 导出图片</button>

  <hr class="divider">

  <div id="validation-status">尚未标注</div>
  <div id="label-count-row">共 <span id="label-count">0</span> 个标注</div>

  <hr class="divider">

  <div id="label-list"></div>
</div>

<script>
// ── 全局状态 ──────────────────────────────────────────────
const state = {
  labels: [],           // [{id, fabricGroup, x, y, number}] x/y 为原图坐标
  nextId: 1,
  imageScale: 1,        // Canvas显示尺寸 / 原图尺寸
  imagePath: null,      // 服务端路径，用于 /detect 和 /export
  imageWidth: 0,        // 原图宽度（像素）
  imageHeight: 0,
  manualMode: false,
  selectMode: false,    // 框选识别模式
  drawing: false,       // 正在拖拽绘制中
  drawStart: null,      // {x, y} Canvas 坐标
  tmpRect: null,        // 临时选框 fabric.Rect
};

// ── Fabric Canvas 初始化 ───────────────────────────────────
const canvas = new fabric.Canvas('main-canvas', {
  selection: false,
});

// ── 图片上传 ──────────────────────────────────────────────
document.getElementById('file-input').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append('file', file);

  const resp = await fetch('/upload', { method: 'POST', body: formData });
  if (!resp.ok) {
    alert('上传失败：' + (await resp.json()).error);
    return;
  }
  const data = await resp.json();
  loadImageToCanvas(data.image_url, data.image_path, data.width, data.height);
  e.target.value = '';
});

function loadImageToCanvas(imageUrl, imagePath, origW, origH) {
  canvas.clear();
  state.labels = [];
  state.nextId = 1;
  state.imagePath = imagePath;
  state.imageWidth = origW;
  state.imageHeight = origH;
  renderLabelList();
  updateValidation();

  const container = document.getElementById('canvas-container');
  const maxW = container.clientWidth - 16;
  const maxH = container.clientHeight - 16;
  const scale = Math.min(maxW / origW, maxH / origH, 1);
  state.imageScale = scale;

  const dispW = Math.round(origW * scale);
  const dispH = Math.round(origH * scale);
  canvas.setWidth(dispW);
  canvas.setHeight(dispH);

  document.getElementById('drop-hint').style.display = 'none';

  fabric.Image.fromURL(imageUrl, (img) => {
    img.set({ scaleX: scale, scaleY: scale, selectable: false, evented: false, left: 0, top: 0 });
    canvas.add(img);
    canvas.sendToBack(img);
    canvas.renderAll();

    document.getElementById('btn-detect').disabled = false;
    document.getElementById('btn-select').disabled = false;
    document.getElementById('toggle-manual').disabled = false;
    document.getElementById('btn-clear').disabled = false;
    document.getElementById('btn-export').disabled = false;
  });
}

// ── 标注圆形半径（自适应原图尺寸）────────────────────────
function getLabelRadius() {
  const shortSide = Math.min(state.imageWidth, state.imageHeight);
  return Math.max(14, Math.min(Math.round(shortSide / 40), 28));
}

// ── 在 Canvas 坐标处创建标注 ──────────────────────────────
function addLabel(canvasX, canvasY) {
  const r = getLabelRadius() * state.imageScale;
  const number = state.labels.length + 1;

  const circle = new fabric.Circle({
    radius: r, fill: '#E74C3C', originX: 'center', originY: 'center',
  });
  const text = new fabric.Text(String(number), {
    fontSize: Math.max(10, r * 1.1),
    fill: '#FFFFFF', fontWeight: 'bold',
    originX: 'center', originY: 'center',
  });
  const group = new fabric.Group([circle, text], {
    left: canvasX, top: canvasY,
    originX: 'center', originY: 'center',
    selectable: false, evented: true,
  });

  canvas.add(group);
  canvas.bringToFront(group);

  state.labels.push({
    id: state.nextId++,
    fabricGroup: group,
    x: Math.round(canvasX / state.imageScale),
    y: Math.round(canvasY / state.imageScale),
    number,
  });

  renderLabelList();
  updateValidation();
  canvas.renderAll();
}

// ── 删除指定 id 的标注 ────────────────────────────────────
function removeLabel(id) {
  const idx = state.labels.findIndex(l => l.id === id);
  if (idx === -1) return;
  canvas.remove(state.labels[idx].fabricGroup);
  state.labels.splice(idx, 1);
  renumberLabels();
  renderLabelList();
  updateValidation();
  canvas.renderAll();
}

// ── 清除全部标注 ──────────────────────────────────────────
document.getElementById('btn-clear').addEventListener('click', () => {
  state.labels.forEach(l => canvas.remove(l.fabricGroup));
  state.labels = [];
  state.nextId = 1;
  renderLabelList();
  updateValidation();
  canvas.renderAll();
});

// ── 重新编号（删除后保证 1..N 连续）──────────────────────
function renumberLabels() {
  state.labels.forEach((label, i) => {
    label.number = i + 1;
    const objs = label.fabricGroup.getObjects();
    const textObj = objs.find(o => o.type === 'text');
    if (textObj) {
      textObj.set('text', String(i + 1));
      label.fabricGroup.addWithUpdate();
    }
  });
}

// ── 渲染右侧标注列表 ──────────────────────────────────────
function renderLabelList() {
  const list = document.getElementById('label-list');
  list.innerHTML = '';
  state.labels.forEach(label => {
    const item = document.createElement('div');
    item.className = 'label-item';
    item.innerHTML = `
      <div class="label-badge">${label.number}</div>
      <span class="label-coords">(${label.x}, ${label.y})</span>
      <button class="label-delete" onclick="removeLabel(${label.id})">×</button>
    `;
    list.appendChild(item);
  });
}

// ── 校验编号连续性 ────────────────────────────────────────
function updateValidation() {
  const el = document.getElementById('validation-status');
  const countEl = document.getElementById('label-count');
  const n = state.labels.length;
  countEl.textContent = n;

  if (n === 0) {
    el.textContent = '尚未标注';
    el.className = '';
    return;
  }

  const nums = state.labels.map(l => l.number).sort((a, b) => a - b);
  const ok = nums.every((v, i) => v === i + 1);
  if (ok) {
    el.textContent = `✅ 编号正常，共 ${n} 个物品`;
    el.className = '';
  } else {
    el.textContent = `⚠️ 编号异常，请检查`;
    el.className = 'error';
  }
}

// ── 识别参数滑块联动 ─────────────────────────────────────
['block-size', 'c-value', 'morph'].forEach(name => {
  const slider = document.getElementById(`slider-${name}`);
  const display = document.getElementById(`val-${name}`);
  slider.addEventListener('input', () => { display.textContent = slider.value; });
});

// ── 模式1：自动识别 ───────────────────────────────────────
document.getElementById('btn-detect').addEventListener('click', async () => {
  if (!state.imagePath) return;

  const btn = document.getElementById('btn-detect');
  btn.disabled = true;
  btn.textContent = '🔍 识别中...';

  const blockSize = parseInt(document.getElementById('slider-block-size').value, 10);
  const cValue = parseInt(document.getElementById('slider-c-value').value, 10);
  const morph = parseInt(document.getElementById('slider-morph').value, 10);

  try {
    const resp = await fetch('/detect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        image_path: state.imagePath,
        block_size: blockSize,
        c_value: cValue,
        morph_iterations: morph,
      }),
    });
    const data = await resp.json();

    if (!resp.ok) {
      alert('识别失败：' + data.error);
      return;
    }

    state.labels.forEach(l => canvas.remove(l.fabricGroup));
    state.labels = [];
    state.nextId = 1;

    if (data.items.length === 0) {
      alert('未检测到物品，请切换手动模式进行标注');
    } else {
      data.items.forEach(item => {
        const cx = (item.x + item.w / 2) * state.imageScale;
        const cy = (item.y + item.h / 2) * state.imageScale;
        addLabel(cx, cy);
      });
    }
  } finally {
    btn.disabled = false;
    btn.textContent = '🔍 自动识别';
  }
});

// ── 模式2：手动点击 ───────────────────────────────────────
document.getElementById('toggle-manual').addEventListener('change', (e) => {
  state.manualMode = e.target.checked;
  canvas.defaultCursor = state.manualMode ? 'crosshair' : 'default';
});

canvas.on('mouse:down', (opt) => {
  const pointer = canvas.getPointer(opt.e);
  const x = pointer.x;
  const y = pointer.y;
  const imgW = state.imageWidth * state.imageScale;
  const imgH = state.imageHeight * state.imageScale;

  if (state.selectMode) {
    if (x < 0 || y < 0 || x > imgW || y > imgH) return;
    if (state.tmpRect) { canvas.remove(state.tmpRect); state.tmpRect = null; }
    state.drawing = true;
    state.drawStart = { x, y };
    state.tmpRect = new fabric.Rect({
      left: x, top: y, width: 0, height: 0,
      stroke: '#f39c12', strokeWidth: 2,
      strokeDashArray: [6, 4],
      fill: 'rgba(243,156,18,0.12)',
      selectable: false, evented: false,
    });
    canvas.add(state.tmpRect);
    document.getElementById('btn-match').disabled = true;
    return;
  }

  if (!state.manualMode) return;
  if (!state.imagePath) return;
  if (x < 0 || y < 0 || x > imgW || y > imgH) return;
  const target = canvas.findTarget(opt.e);
  if (target && target.type === 'group') return;
  addLabel(x, y);
});

canvas.on('mouse:move', (opt) => {
  if (!state.drawing || !state.selectMode) return;
  const p = canvas.getPointer(opt.e);
  const rx = Math.min(p.x, state.drawStart.x);
  const ry = Math.min(p.y, state.drawStart.y);
  const rw = Math.abs(p.x - state.drawStart.x);
  const rh = Math.abs(p.y - state.drawStart.y);
  state.tmpRect.set({ left: rx, top: ry, width: rw, height: rh });
  canvas.renderAll();
});

canvas.on('mouse:up', (opt) => {
  if (!state.drawing || !state.selectMode) return;
  state.drawing = false;
  const rw = state.tmpRect.width;
  const rh = state.tmpRect.height;
  if (rw < 10 || rh < 10) {
    canvas.remove(state.tmpRect);
    state.tmpRect = null;
    canvas.renderAll();
    return;
  }
  document.getElementById('btn-match').disabled = false;
  canvas.renderAll();
});

// ── 框选识别模式 ──────────────────────────────────────────
function cancelSelectMode() {
  state.selectMode = false;
  state.drawing = false;
  state.drawStart = null;
  if (state.tmpRect) { canvas.remove(state.tmpRect); state.tmpRect = null; }
  canvas.defaultCursor = 'default';
  canvas.renderAll();
  document.getElementById('btn-select').textContent = '🎯 框选识别';
  document.getElementById('btn-select').classList.remove('active');
  document.getElementById('select-confirm').style.display = 'none';
  document.getElementById('btn-match').disabled = true;
}

document.getElementById('btn-select').addEventListener('click', () => {
  if (state.selectMode) {
    cancelSelectMode();
    return;
  }
  // 互斥：关闭手动模式
  if (state.manualMode) {
    document.getElementById('toggle-manual').checked = false;
    state.manualMode = false;
    canvas.defaultCursor = 'default';
  }
  state.selectMode = true;
  canvas.defaultCursor = 'crosshair';
  document.getElementById('btn-select').textContent = '🎯 框选中（点击取消）';
  document.getElementById('btn-select').classList.add('active');
  document.getElementById('select-confirm').style.display = 'block';
});

document.getElementById('slider-threshold').addEventListener('input', (e) => {
  document.getElementById('val-threshold').textContent = parseFloat(e.target.value).toFixed(2);
});

document.getElementById('btn-cancel-select').addEventListener('click', cancelSelectMode);

document.getElementById('btn-match').addEventListener('click', async () => {
  if (!state.tmpRect || !state.imagePath) return;

  const scale = state.imageScale;
  const templateBox = {
    x: Math.round(state.tmpRect.left / scale),
    y: Math.round(state.tmpRect.top / scale),
    w: Math.round(state.tmpRect.width / scale),
    h: Math.round(state.tmpRect.height / scale),
  };
  const threshold = parseFloat(document.getElementById('slider-threshold').value);

  const btn = document.getElementById('btn-match');
  btn.disabled = true;
  btn.textContent = '🔍 识别中...';

  try {
    const resp = await fetch('/match', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image_path: state.imagePath, template_box: templateBox, threshold }),
    });
    const data = await resp.json();

    cancelSelectMode();

    if (!resp.ok) {
      alert('识别失败：' + data.error);
      return;
    }

    state.labels.forEach(l => canvas.remove(l.fabricGroup));
    state.labels = [];
    state.nextId = 1;

    if (data.items.length === 0) {
      alert('未找到相似物品，请降低阈值或重新框选');
    } else {
      data.items.forEach(item => {
        const cx = (item.x + item.w / 2) * state.imageScale;
        const cy = (item.y + item.h / 2) * state.imageScale;
        addLabel(cx, cy);
      });
    }
  } finally {
    btn.textContent = '✅ 确认识别';
  }
});

// ── 导出图片 ──────────────────────────────────────────────
document.getElementById('btn-export').addEventListener('click', async () => {
  if (state.labels.length === 0) {
    alert('请先添加标注再导出');
    return;
  }

  const btn = document.getElementById('btn-export');
  btn.disabled = true;
  btn.textContent = '💾 导出中...';

  try {
    const labels = state.labels.map(l => ({
      x: l.x,
      y: l.y,
      number: l.number,
    }));

    const resp = await fetch('/export', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image_path: state.imagePath, labels }),
    });

    if (!resp.ok) {
      const err = await resp.json();
      alert('导出失败：' + err.error);
      return;
    }

    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'annotated.png';
    a.click();
    URL.revokeObjectURL(url);
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 导出图片';
  }
});
</script>
</body>
</html>
